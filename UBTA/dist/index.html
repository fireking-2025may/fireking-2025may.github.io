function syncTableCell(cell){const blockId=cell.closest('.table-block').dataset.blockId,rowId=cell.dataset.rowId,cellId=cell.dataset.cellId,runs=domRuns(cell);commit(()=>{const row=findBlock(blockId)?.rows.find(r=>r.id===rowId),target=row?.cells.find(c=>c.id===cellId);if(target)target.runs=runs})}
function selectTable(cell){document.querySelectorAll('.table-cell-selected').forEach(x=>x.classList.remove('table-cell-selected'));cell?.classList.add('table-cell-selected');window.activeTable=cell?.closest?.('.table-block')?.dataset.blockId||null;window.activeCell=cell?{rowId:cell.dataset.rowId,columnId:cell.dataset.columnId}:null;const controls=$('#table-controls');controls.hidden=!window.activeTable;if(!window.activeTable)return;const b=findBlock(window.activeTable),select=$('#table-total');select.innerHTML='<option value="">None</option>'+b.columns.map((c,i)=>`<option value="${escapeHTML(c.id)}">Column ${i+1}</option>`).join('');select.value=b.totalColumn?.columnId||'';$('#total-precision').value=b.totalColumn?.precision??2}
function bindTable(wrap){wrap.addEventListener('focusin',e=>{const cell=e.target.closest('th,td[contenteditable]');if(cell){window.activeBlock=wrap.dataset.blockId;selectTable(cell)}});wrap.querySelectorAll('th[contenteditable],td[contenteditable]').forEach(cell=>{cell.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>syncTableCell(cell),450)});cell.addEventListener('paste',plainPaste)});wrap.querySelectorAll('.column-resize').forEach(handle=>{handle.addEventListener('pointerdown',startResize);handle.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();resizeColumns(wrap.dataset.blockId,+handle.dataset.columnIndex,e.key==='ArrowLeft'?-2:2)}})})}
function resizeColumns(id,index,delta){const b=findBlock(id),a=b?.columns[index],z=b?.columns[index+1];if(!a||!z)return;delta=Math.max(8-a.width,Math.min(z.width-8,delta));if(!delta)return;commit(()=>{const cols=findBlock(id).columns;cols[index].width+=delta;cols[index+1].width-=delta})}
function startResize(e){e.preventDefault();const handle=e.currentTarget,wrap=handle.closest('.table-block'),b=findBlock(wrap.dataset.blockId),index=+handle.dataset.columnIndex,start=e.clientX,startA=b.columns[index].width,startB=b.columns[index+1].width,px=wrap.querySelector('table').getBoundingClientRect().width;handle.setPointerCapture(e.pointerId);const move=ev=>{let d=(ev.clientX-start)/px*100;d=Math.max(8-startA,Math.min(startB-8,d));wrap.querySelectorAll(`[data-column-id="${b.columns[index].id}"]`).forEach(c=>c.style.width=`${startA+d}%`);wrap.querySelectorAll(`[data-column-id="${b.columns[index+1].id}"]`).forEach(c=>c.style.width=`${startB-d}%`);handle._delta=d};const end=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);if(handle._delta)resizeColumns(wrap.dataset.blockId,index,handle._delta);delete handle._delta};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end)}
function syncBlock(el){const id=el.dataset.blockId;commit(()=>{const b=findBlock(id);if(!b)return;if(b.type.endsWith('List'))b.items=[...el.querySelectorAll('.list-item')].map((x,i)=>({id:x.dataset.itemId||`${id}-item-${i}`,level:+x.dataset.level||1,runs:[{text:x.textContent,highlight:false,link:null}]}));else b.runs=[{text:el.textContent,highlight:false,link:null}]})}
function listKeys(e){const el=e.currentTarget;if(!el.dataset.listType)return;const item=e.target.closest('.list-item');if(e.key==='Enter'){e.preventDefault();if(!item.textContent.trim()){commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items});return}const n=document.createElement('div');n.className='list-item';n.dataset.itemId=`item-${Date.now()}`;n.dataset.level=item.dataset.level;n.style.listStyleType=el.dataset.listType==='numberList'?'decimal':'disc';n.contentEditable='true';item.after(n);n.focus()}if(e.key==='Backspace'&&item&&!item.textContent&&getSelection().anchorOffset===0){e.preventDefault();commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items})}}
function selectedOffsets(el){const sel=getSelection();if(!sel.rangeCount||!el.contains(sel.anchorNode)||!el.contains(sel.focusNode))return null;const r=sel.getRangeAt(0),pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length;return[start,start+r.toString().length]}
function transformSelection(kind,value){const el=document.querySelector(`[data-block-id="${window.activeBlock}"]`),off=el&&selectedOffsets(el);if(!off||off[0]===off[1])return;commit(()=>{const b=findBlock(window.activeBlock);if(!b||!b.runs)return;const text=textRuns(b.runs),[a,z]=off;b.runs=normaliseRuns([{text:text.slice(0,a)},{text:text.slice(a,z),highlight:kind==='highlight'?!runsAt(b.runs,a).highlight:runsAt(b.runs,a).highlight,link:kind==='link'?{href:value}:kind==='unlink'?null:runsAt(b.runs,a).link},{text:text.slice(z)}])})}
function runsAt(runs,pos){let n=0;return runs.find(r=>(n+=r.text.length)>pos)||runs.at(-1)||{}}
const newId=prefix=>`${prefix}-${crypto.randomUUID?.()||Date.now().toString(36)}`;
function tableCommand(action){const id=window.activeTable;if(!id)return;commit(()=>{const b=findBlock(id);if(!b)return;const rowIndex=Math.max(0,b.rows.findIndex(r=>r.id===window.activeCell?.rowId)),columnIndex=Math.max(0,b.columns.findIndex(c=>c.id===window.activeCell?.columnId));if(action==='add-row')b.rows.splice(rowIndex+1,0,{id:newId('row'),cells:b.columns.map(()=>({id:newId('cell'),runs:[]}))});else if(action==='delete-row'&&b.rows.length)b.rows.splice(rowIndex,1);else if(action==='add-column'){const width=Math.max(8,100/(b.columns.length+1));b.columns.forEach(c=>c.width*=((100-width)/100));b.columns.splice(columnIndex+1,0,{id:newId('column'),width});b.rows.forEach(r=>r.cells.splice(columnIndex+1,0,{id:newId('cell'),runs:[]}))}else if(action==='delete-column'&&b.columns.length>1){const removed=b.columns.splice(columnIndex,1)[0];b.rows.forEach(r=>r.cells.splice(columnIndex,1));const total=b.columns.reduce((n,c)=>n+c.width,0);b.columns.forEach(c=>c.width=c.width/total*100);if(b.totalColumn?.columnId===removed.id)b.totalColumn=null}else if(action==='header')b.headerRow=!b.headerRow;else if(action==='remove'){for(const group of [...state.sections,...state.steps]){const i=group.blocks.findIndex(x=>x.id===id);if(i>=0){group.blocks.splice(i,1);break}}window.activeTable=null;window.activeCell=null}})}
function command(action){const id=window.activeBlock;if(action==='undo'){state=history.undo();return render()}if(action==='redo'){state=history.redo();return render()}if(action==='highlight')return transformSelection('highlight');if(action==='link'){const href=prompt('Link destination (https:, http:, mailto: or #anchor)');if(href&&safeHref(href))transformSelection('link',href);else if(href)alert('That link destination is not permitted.');return}if(action==='unlink')return transformSelection('unlink');if(!id)return;commit(()=>{const b=findBlock(id);if(action.startsWith('heading')){b.type='heading';b.level=+action.at(-1);b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(action==='body'){b.type='paragraph';b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(['bulletList','numberList'].includes(action)){const runs=b.runs||[{text:'List item'}];b.type=action;b.items=[{id:`${id}-item`,level:1,runs}];delete b.runs}else if(action==='indent'||action==='outdent'){if(b.items)b.items[0].level=Math.max(1,Math.min(3,b.items[0].level+(action==='indent'?1:-1)))}})}
document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>command(x.dataset.command));document.querySelectorAll('[data-table-command]').forEach(x=>x.onclick=()=>tableCommand(x.dataset.tableCommand));$('#table-total').onchange=e=>{const id=window.activeTable,value=e.target.value,precision=+$('#total-precision').value;commit(()=>{findBlock(id).totalColumn=value?{columnId:value,precision,label:'Total'}:null})};$('#total-precision').onchange=e=>{const id=window.activeTable,precision=Math.min(12,Math.max(0,+e.target.value||0));commit(()=>{const b=findBlock(id);if(b.totalColumn)b.totalColumn.precision=precision})};$('#style').onchange=e=>command(e.target.value);function go(n){const pages=[...document.querySelectorAll('.pagedjs_page')];currentPage=Math.max(1,Math.min(pages.length,n));$('#current').textContent=currentPage;pages[currentPage-1]?.scrollIntoView({behavior:'smooth',block:'center'})}$('#prev').onclick=()=>go(currentPage-1);$('#next').onclick=()=>go(currentPage+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft')go(currentPage-1);if(e.altKey&&e.key==='ArrowRight')go(currentPage+1)});render();
</script></body></html>
