const SCHEMA_VERSION=1;

function normaliseRuns(runs){const out=(Array.isArray(runs)?runs:[]).map(r=>({text:String(r?.text??''),highlight:r?.highlight===true,link:safeHref(r?.link?.href)?{href:safeHref(r.link.href)}:null})).filter(r=>r.text).reduce((a,r)=>{const x=a.at(-1);if(x&&x.highlight===r.highlight&&x.link?.href===r.link?.href)x.text+=r.text;else a.push(r);return a},[]);return out.length?out:[{text:'',highlight:false,link:null}]}

function normaliseDocument(d){const meta={};for(const k of ['clientName','projectTitle','documentType','date','version','subtitle','adviser','status'])meta[k]=String(d?.meta?.[k]??'');const groups=k=>(Array.isArray(d?.[k])?d[k]:[]).map(x=>({id:id(x?.id,k.slice(0,-1)),title:String(x?.title??''),blocks:(Array.isArray(x?.blocks)?x.blocks:[]).map(normaliseBlock)}));return{schemaVersion:SCHEMA_VERSION,meta,sections:groups('sections'),steps:groups('steps')}}

const seedDocument=normaliseDocument({schemaVersion:1,meta:{clientName:'Example Client Ltd',projectTitle:'Corporate Restructure',documentType:'Steps Plan',subtitle:'Detailed Steps Plan',date:'25 July 2026',version:'v1',adviser:'UBTA Accountants Ltd',status:'Draft'},sections:[{id:'scope',title:'Scope of works',blocks:[{id:'scope-h',type:'heading',level:2,runs:[{text:'Purpose and scope'}]},{id:'scope-p1',type:'paragraph',runs:[{text:'This plan outlines the principal implementation steps for a proposed corporate restructure.'}]},{id:'scope-p2',type:'paragraph',runs:[{text:'Figures and legal mechanics marked for review require completion before finalisation.',highlight:true}]},{id:'scope-list',type:'bulletList',items:[{id:'si1',level:1,runs:[{text:'Confirm commercial objectives'}]},{id:'si2',level:2,runs:[{text:'Review supporting records'}]},{id:'si3',level:1,runs:[{text:'Consult the ',link:null},{text:'HMRC guidance',link:{href:'https://www.gov.uk/government/organisations/hm-revenue-customs'}}]}]}]}],steps:[{id:'share-restructure',title:'Implement the corporate share restructure',blocks:[{id:'step-h',type:'heading',level:2,runs:[{text:'Implementation'}]},{id:'step-p1',type:'paragraph',runs:[{text:'The directors will approve the proposed corporate restructure and authorise the required documentation.'}]},{id:'step-p2',type:'paragraph',runs:[{text:'Professional advisers should confirm the sequence immediately before implementation.'}]},{id:'step-list',type:'numberList',items:[{id:'st1',level:1,runs:[{text:'Prepare board minutes and resolutions.'}]},{id:'st2',level:2,runs:[{text:'Check company records and statutory filings.'}]},{id:'st3',level:1,runs:[{text:'Complete and retain the signed documents.'}]}]}]}]});

class History{constructor(value){this.past=[];this.future=[];this.value=value}commit(value){this.past.push(structuredClone(this.value));this.value=value;this.future=[]}undo(){if(!this.past.length)return this.value;this.future.push(structuredClone(this.value));return this.value=this.past.pop()}redo(){if(!this.future.length)return this.value;this.past.push(structuredClone(this.value));return this.value=this.future.pop()}}

const history=new History(structuredClone(seedDocument));let state=history.value,currentPage=1,timer,pendingEdit;
const $=s=>document.querySelector(s); const textRuns=r=>r.map(x=>x.text).join('');
function hasReview(group){return group.blocks.some(b=>(b.runs||b.items?.flatMap(i=>i.runs)||[]).some(r=>r.highlight))}
function header(){const x=document.createElement('header');x.className='page-header';x.setAttribute('aria-label','UBTA Accountants report header');x.innerHTML='<span class="header-brand">UBTA</span><span class="header-details">UBTA Accountants Ltd <b aria-hidden="true">·</b> Practical tax advice</span>';return x}
function sheet(kind){const x=document.createElement('section');x.className=`sheet-source ${kind}`;x.append(header());return x}
function footer(x,n,total){const f=document.createElement('footer');f.className='page-footer';f.textContent=`Page ${n} of ${total}`;x.append(f)}
function runsHTML(runs){return runs.map(r=>{let t=escapeHTML(r.text);if(r.link)t=`<a href="${escapeHTML(r.link.href)}" target="_blank" rel="noopener">${t}</a>`;return r.highlight?`<mark>${t}</mark>`:t}).join('')}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Convert browser-edited DOM back to the deliberately small rich-text schema.
// Unknown elements contribute their text/approved descendants, but never formatting.
function domToRuns(root){
  const runs=[];
  const walk=(node,format={highlight:false,link:null})=>{
    if(node.nodeType===Node.TEXT_NODE){runs.push({text:node.nodeValue||'',...format});return}
    if(node.nodeType!==Node.ELEMENT_NODE&&node.nodeType!==Node.DOCUMENT_FRAGMENT_NODE)return;
    const tag=node.nodeType===Node.ELEMENT_NODE?node.tagName.toLowerCase():'';

    if(tag==='mark')next.highlight=true;
    if(tag==='a')next.link=safeHref(node.getAttribute('href'))?{href:safeHref(node.getAttribute('href'))}:null;
    node.childNodes.forEach(child=>walk(child,next));
  };
  walk(root);
  return normaliseRuns(runs);
}
function editable(block){const el=document.createElement('div');el.className='editable-block';el.dataset.blockId=block.id;el.dataset.type=block.type;el.dataset.level=block.level||'';el.contentEditable='true';el.lang='en-GB';el.spellcheck=true;if(block.type==='heading')el.innerHTML=runsHTML(block.runs);else if(block.type==='paragraph')el.innerHTML=runsHTML(block.runs);else{el.classList.add('list-block');el.dataset.listType=block.type;el.innerHTML=block.items.map(i=>`<div class="list-item" data-item-id="${i.id}" data-level="${i.level}" style="list-style-type:${block.type==='numberList'?'decimal':'disc'}">${runsHTML(i.runs)}</div>`).join('')}return el}
function cover(){const s=sheet('cover');const m=state.meta;s.insertAdjacentHTML('beforeend',`<div class="cover-kicker">${escapeHTML(m.documentType)} · ${escapeHTML(m.status)}</div><h1>${escapeHTML(m.clientName)}</h1><h2>${escapeHTML(m.projectTitle)} — ${escapeHTML(m.subtitle)}</h2><dl class="meta-grid"><dt>Document</dt><dd>${escapeHTML(m.documentType)}</dd><dt>Date</dt><dd>${escapeHTML(m.date)}</dd><dt>Version</dt><dd>${escapeHTML(m.version)}</dd><dt>Adviser</dt><dd>${escapeHTML(m.adviser)}</dd><dt>Status</dt><dd>${escapeHTML(m.status)}</dd></dl>`);return s}
function toc(pageMap={}){const s=sheet('contents');let entries=state.sections.map(g=>({g,label:g.title,cls:''})).concat(state.steps.map((g,i)=>({g,label:`Step ${i+1}. ${g.title}`,cls:'toc-step'})));s.insertAdjacentHTML('beforeend',`<h1 class="doc-title">Contents</h1><ol class="toc">${entries.map(e=>`<li class="${e.cls} ${hasReview(e.g)?'toc-review':''}"><a href="#anchor-${e.g.id}">${escapeHTML(e.label)}</a><span class="dots"></span><span class="toc-page">${pageMap[`anchor-${e.g.id}`]||'—'}</span></li>`).join('')}</ol>`);return s}
function groupSheet(g,title,kind){const s=sheet(kind);s.id=`anchor-${g.id}`;s.tabIndex=-1;s.insertAdjacentHTML('beforeend',kind==='step'?`<div class="step-label">${escapeHTML(title.split('.')[0])}</div><h1 class="section-title">${escapeHTML(title)}</h1>`:`<h1 class="section-title">${escapeHTML(title)}</h1>`);const body=document.createElement('div');body.className='document-body';g.blocks.forEach(b=>body.append(editable(b)));s.append(body);return s}
function selectionSnapshot(){const el=document.querySelector(`[data-block-id="${window.activeBlock}"]`);return el&&document.activeElement===el||el?.contains(document.activeElement)?{id:window.activeBlock,offsets:selectedOffsets(el)}:null}
function restoreSelection(snapshot){if(!snapshot)return;const el=document.querySelector(`[data-block-id="${snapshot.id}"]`);if(!el)return;el.focus({preventScroll:true});if(!snapshot.offsets)return;const points=[];const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node,total=0;while((node=walker.nextNode())){points.push({node,start:total,end:total+node.data.length});total+=node.data.length}const point=offset=>{const p=points.find(x=>offset<=x.end)||points.at(-1);return p?{node:p.node,offset:Math.max(0,Math.min(p.node.data.length,offset-p.start))}:{node:el,offset:0}};const a=point(snapshot.offsets[0]),z=point(snapshot.offsets[1]),range=document.createRange();range.setStart(a.node,a.offset);range.setEnd(z.node,z.offset);const selection=getSelection();selection.removeAllRanges();selection.addRange(range)}
async function render(){const selection=selectionSnapshot();const source=document.createElement('main');source.append(cover(),toc(window.__pageMap||{}));state.sections.forEach(g=>source.append(groupSheet(g,g.title,'section')));state.steps.forEach((g,i)=>source.append(groupSheet(g,`Step ${i+1}. ${g.title}`,'step')));const previewer=new Paged.Previewer();const target=$('#preview');await previewer.preview(source,[],target);const pages=[...target.children],map={};pages.forEach((p,i)=>{footer(p.querySelector('.sheet-source'),i+1,pages.length);p.dataset.pageNumber=i+1;p.querySelectorAll('[id^="anchor-"]').forEach(a=>map[a.id]=i+1)});window.__pageMap=map;target.querySelectorAll('.toc-page').forEach((n,i)=>{const keys=[...state.sections,...state.steps].map(g=>`anchor-${g.id}`);n.textContent=map[keys[i]]||'—'});bindEditing();restoreSelection(selection);$('#total').textContent=pages.length;currentPage=Math.min(currentPage,pages.length);$('#current').textContent=currentPage}
function findBlock(id){for(const group of [...state.sections,...state.steps]){const b=group.blocks.find(x=>x.id===id);if(b)return b}}
function commit(mutator,rerender=true){const previous=state;state=structuredClone(state);mutator();state=normaliseDocument(state);history.value=previous;history.commit(state);state=history.value;if(rerender)render()}
function flushPending(rerender=false){if(!pendingEdit)return;clearTimeout(timer);timer=null;const el=pendingEdit;pendingEdit=null;syncBlock(el,rerender)}
function bindEditing(){document.querySelectorAll('.editable-block').forEach(el=>{el.addEventListener('focusin',()=>window.activeBlock=el.dataset.blockId);el.addEventListener('input',()=>{clearTimeout(timer);pendingEdit=el;timer=setTimeout(()=>{const pending=pendingEdit;pendingEdit=null;timer=null;if(pending)syncBlock(pending)},450)});el.addEventListener('paste',e=>{e.preventDefault();const t=e.clipboardData.getData('text/plain');const sel=getSelection();if(sel.rangeCount){sel.deleteFromDocument();sel.getRangeAt(0).insertNode(document.createTextNode(t));sel.collapseToEnd()}el.dispatchEvent(new InputEvent('input'))});el.addEventListener('keydown',listKeys)});document.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();flushPending();const dest=document.querySelector(a.getAttribute('href'));dest?.closest('.pagedjs_page')?.scrollIntoView({behavior:'smooth',block:'center'});dest?.focus()})}
function syncBlock(el,rerender=true){const id=el.dataset.blockId;commit(()=>{const b=findBlock(id);if(!b)return;if(b.type.endsWith('List'))b.items=[...el.querySelectorAll('.list-item')].map((x,i)=>({id:x.dataset.itemId||`${id}-item-${i}`,level:+x.dataset.level||1,runs:domToRuns(x)}));else b.runs=domToRuns(el);
  // Future/extended rich-text surfaces use the identical whitelist parser.
  el.querySelectorAll('[data-table-cell]').forEach(x=>{const cell=b.cells?.[+x.dataset.tableCell];if(cell)cell.runs=domToRuns(x)});
  const caption=el.querySelector('[data-image-caption]');if(caption&&b.caption)b.caption.runs=domToRuns(caption)
},rerender)}
function listKeys(e){const el=e.currentTarget;if(!el.dataset.listType)return;const item=e.target.closest('.list-item');if(e.key==='Enter'||e.key==='Backspace')flushPending();if(e.key==='Enter'){e.preventDefault();if(!item.textContent.trim()){commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items});return}const n=document.createElement('div');n.className='list-item';n.dataset.itemId=`item-${Date.now()}`;n.dataset.level=item.dataset.level;n.style.listStyleType=el.dataset.listType==='numberList'?'decimal':'disc';n.contentEditable='true';item.after(n);n.focus()}if(e.key==='Backspace'&&item&&!item.textContent&&getSelection().anchorOffset===0){e.preventDefault();commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items})}}
function selectedOffsets(el){const sel=getSelection();if(!sel.rangeCount||!el.contains(sel.anchorNode)||!el.contains(sel.focusNode))return null;const r=sel.getRangeAt(0),pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length;return[start,start+r.toString().length]}
function transformSelection(kind,value){const el=document.querySelector(`[data-block-id="${window.activeBlock}"]`),off=el&&selectedOffsets(el);if(!off||off[0]===off[1])return;commit(()=>{const b=findBlock(window.activeBlock);if(!b||!b.runs)return;const text=textRuns(b.runs),[a,z]=off;b.runs=normaliseRuns([{text:text.slice(0,a)},{text:text.slice(a,z),highlight:kind==='highlight'?!runsAt(b.runs,a).highlight:runsAt(b.runs,a).highlight,link:kind==='link'?{href:value}:kind==='unlink'?null:runsAt(b.runs,a).link},{text:text.slice(z)}])})}
function runsAt(runs,pos){let n=0;return runs.find(r=>(n+=r.text.length)>pos)||runs.at(-1)||{}}
function command(action){flushPending();const id=window.activeBlock;if(action==='undo'){state=history.undo();return render()}if(action==='redo'){state=history.redo();return render()}if(action==='highlight')return transformSelection('highlight');if(action==='link'){const href=prompt('Link destination (https:, http:, mailto: or #anchor)');if(href&&safeHref(href))transformSelection('link',href);else if(href)alert('That link destination is not permitted.');return}if(action==='unlink')return transformSelection('unlink');if(!id)return;commit(()=>{const b=findBlock(id);if(action.startsWith('heading')){b.type='heading';b.level=+action.at(-1);b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(action==='body'){b.type='paragraph';b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(['bulletList','numberList'].includes(action)){const runs=b.runs||[{text:'List item'}];b.type=action;b.items=[{id:`${id}-item`,level:1,runs}];delete b.runs}else if(action==='indent'||action==='outdent'){if(b.items)b.items[0].level=Math.max(1,Math.min(3,b.items[0].level+(action==='indent'?1:-1)))}})}
function reorderStep(from,to){flushPending();commit(()=>{if(from<0||from>=state.steps.length||to<0||to>=state.steps.length)return;const [step]=state.steps.splice(from,1);state.steps.splice(to,0,step)})}
document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>command(x.dataset.command));$('#style').onchange=e=>command(e.target.value);function go(n){flushPending();const pages=[...document.querySelectorAll('.pagedjs_page')];currentPage=Math.max(1,Math.min(pages.length,n));$('#current').textContent=currentPage;pages[currentPage-1]?.scrollIntoView({behavior:'smooth',block:'center'})}$('#prev').onclick=()=>go(currentPage-1);$('#next').onclick=()=>go(currentPage+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft')go(currentPage-1);if(e.altKey&&e.key==='ArrowRight')go(currentPage+1)});render();
