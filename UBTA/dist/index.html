const SCHEMA_VERSION=2;
const TABLE_MIN_WIDTH=8;
const TABLE_MAX_WIDTH=92;
const IMAGE_MIN_WIDTH=10;
const IMAGE_MAX_WIDTH=100;
const IMAGE_MAX_HEIGHT=170;
const IMAGE_MIME_TYPES=['image/png','image/jpeg','image/gif','image/webp'];

const safeHref=value=>{
  if(typeof value!=='string')return null;
  const href=value.trim();
  return /^(https?:\/\/|mailto:|#[A-Za-z][\w:.-]*$)/i.test(href)?href:null;
};

const rawId=(value,prefix)=>/^[A-Za-z][\w-]*$/.test(value||'')?value:`${prefix}-${globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)}`;
const uniqueId=(value,prefix,seen)=>{
  const base=rawId(value,prefix);let candidate=base,n=2;
  while(seen.has(candidate))candidate=`${base}-${n++}`;
  seen.add(candidate);return candidate;
};
const clamp=(value,min,max,fallback)=>Math.min(max,Math.max(min,Number.isFinite(Number(value))?Number(value):fallback));

function normaliseRuns(runs){
  return (Array.isArray(runs)?runs:[]).map(run=>({text:String(run?.text??''),highlight:run?.highlight===true,link:safeHref(run?.link?.href)?{href:safeHref(run.link.href)}:null})).filter(run=>run.text).reduce((result,run)=>{
    const previous=result.at(-1);
    if(previous&&previous.highlight===run.highlight&&previous.link?.href===run.link?.href)previous.text+=run.text;
    else result.push(run);
    return result;
  },[]);
}

function normaliseWidths(widths,columnCount){
  if(!columnCount)return [];
  const supplied=Array.from({length:columnCount},(_,i)=>clamp(widths?.[i],TABLE_MIN_WIDTH,TABLE_MAX_WIDTH,100/columnCount));
  const total=supplied.reduce((a,b)=>a+b,0)||1;
  let result=supplied.map(width=>width*100/total);
  // Rebalance after clamping. This also guarantees the serialised total is 100.
  result=result.map(width=>clamp(width,TABLE_MIN_WIDTH,TABLE_MAX_WIDTH,100/columnCount));
  const difference=100-result.reduce((a,b)=>a+b,0);
  result[result.length-1]+=difference;
  return result.map(width=>Math.round(width*1000)/1000);
}

function normaliseTable(block,seen){
  const sourceRows=Array.isArray(block.rows)?block.rows:[];
  const columnCount=Math.max(1,Math.min(12,Number(block.columnCount)||Math.max(0,...sourceRows.map(row=>Array.isArray(row?.cells)?row.cells.length:0))||1));
  const rows=sourceRows.filter(row=>row&&Array.isArray(row.cells)).map(row=>({
    id:uniqueId(row.id,'row',seen),
    cells:Array.from({length:columnCount},(_,index)=>{
      const cell=row.cells[index];
      return {id:uniqueId(cell?.id,'cell',seen),runs:normaliseRuns(cell?.runs??(cell==null?[]:[{text:String(cell)}]))};
    })
  }));
  const totalsSource=block.totals||{};
  return {columnCount,widths:normaliseWidths(block.widths,columnCount),rows,totals:{enabled:totalsSource.enabled===true,label:String(totalsSource.label??'Total'),columns:[...new Set((Array.isArray(totalsSource.columns)?totalsSource.columns:[]).map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<columnCount))]}};
}

function safeImageSource(source,mime){
  if(typeof source!=='string'||!IMAGE_MIME_TYPES.includes(mime))return null;
  if(source.startsWith('data:'))return source.startsWith(`data:${mime};base64,`)&&/^[A-Za-z0-9+/]*={0,2}$/.test(source.split(',')[1]||'')?source:null;
  if(source.startsWith('blob:'))return source;
  return null;
}

function normaliseBlock(block,context={seen:new Set()}){
  const seen=context.seen||new Set();
  const accepted=['heading','paragraph','bulletList','numberList','table','image'];
  const type=accepted.includes(block?.type)?block.type:'paragraph';
  const out={id:uniqueId(block?.id,'block',seen),type};
  if(type==='heading'){out.level=clamp(block.level,1,4,1);out.runs=normaliseRuns(block.runs)}
  else if(type==='paragraph')out.runs=normaliseRuns(block.runs);
  else if(type.endsWith('List'))out.items=(Array.isArray(block.items)?block.items:[]).map(item=>({id:uniqueId(item?.id,'item',seen),level:clamp(item?.level,1,3,1),runs:normaliseRuns(item?.runs)}));
  else if(type==='table')Object.assign(out,normaliseTable(block,seen));
  else {
    const mime=IMAGE_MIME_TYPES.includes(block.mime)?block.mime:'image/png';
    Object.assign(out,{src:safeImageSource(block.src,mime),mime,alt:String(block.alt??''),caption:String(block.caption??''),width:clamp(block.width,IMAGE_MIN_WIDTH,IMAGE_MAX_WIDTH,60),height:clamp(block.height,1,IMAGE_MAX_HEIGHT,80)});
  }
  return out;
}

function migrateDocument(input){
  const document=structuredClone(input||{});
  const version=Number(document.schemaVersion??1);
  if(version<1||version>SCHEMA_VERSION)throw Error('Unsupported schema version');
  if(version===1){document.schemaVersion=2;document.settings={...(document.settings||{}),showProposals:true};}
  return document;
}

function normaliseDocument(input){
  const document=migrateDocument(input);const seen=new Set();const meta={};
  for(const key of ['clientName','projectTitle','documentType','date','version','subtitle','adviser','status'])meta[key]=String(document?.meta?.[key]??'');
  const groups=key=>(Array.isArray(document?.[key])?document[key]:[]).map(group=>({id:uniqueId(group?.id,key.slice(0,-1),seen),title:String(group?.title??''),proposal:typeof group?.proposal==='string'?group.proposal:null,blocks:(Array.isArray(group?.blocks)?group.blocks:[]).map(block=>normaliseBlock(block,{seen}))}));
  return {schemaVersion:SCHEMA_VERSION,meta,settings:{showProposals:document?.settings?.showProposals!==false},sections:groups('sections'),steps:groups('steps')};
}
function validateDocument(document){return normaliseDocument(document)}

const seedDocument=normaliseDocument({schemaVersion:2,meta:{clientName:'Example Client Ltd',projectTitle:'Corporate Restructure',documentType:'Steps Plan',subtitle:'Detailed Steps Plan',date:'25 July 2026',version:'v1',adviser:'UBTA Accountants Ltd',status:'Draft'},settings:{showProposals:true},sections:[{id:'scope',title:'Scope of works',blocks:[{id:'scope-h',type:'heading',level:2,runs:[{text:'Purpose and scope'}]},{id:'scope-p1',type:'paragraph',runs:[{text:'This plan outlines the principal implementation steps for a proposed corporate restructure.'}]},{id:'scope-p2',type:'paragraph',runs:[{text:'Figures and legal mechanics marked for review require completion before finalisation.',highlight:true}]}]}],steps:[{id:'share-restructure',title:'Implement the corporate share restructure',blocks:[{id:'step-h',type:'heading',level:2,runs:[{text:'Implementation'}]},{id:'step-p1',type:'paragraph',runs:[{text:'The directors will approve the proposed corporate restructure and authorise the required documentation.'}]},{id:'step-list',type:'numberList',items:[{id:'st1',level:1,runs:[{text:'Prepare board minutes and resolutions.'}]},{id:'st2',level:2,runs:[{text:'Check company records and statutory filings.'}]}]}]}]});

class History{
  constructor(value){this.past=[];this.future=[];this.value=value;this.gesture=null}
  commit(value){this.past.push(structuredClone(this.value));this.value=value;this.future=[];return this.value}
  beginGesture(){if(!this.gesture)this.gesture=structuredClone(this.value);return this.value}
  updateGesture(value){if(!this.gesture)this.beginGesture();this.value=value;return this.value}
  endGesture(value=this.value){if(!this.gesture)return this.value;const before=this.gesture;this.gesture=null;this.value=value;if(JSON.stringify(before)!==JSON.stringify(value)){this.past.push(before);this.future=[]}return this.value}
  cancelGesture(){if(this.gesture){this.value=this.gesture;this.gesture=null}return this.value}
  undo(){if(this.gesture)this.cancelGesture();if(!this.past.length)return this.value;this.future.push(structuredClone(this.value));return this.value=this.past.pop()}
  redo(){if(!this.future.length)return this.value;this.past.push(structuredClone(this.value));return this.value=this.future.pop()}
}

const text=runs=>(runs||[]).map(run=>run.text).join('').trim();
const anchorFor=entity=>`anchor-${entity.id}`;
function deriveSteps(steps=[]){return steps.map((step,index)=>({id:step.id,anchor:anchorFor(step),number:index+1,label:`Step ${index+1}. ${step.title}`}))}
function deriveProposals(steps=[]){return steps.map((step,index)=>({id:`proposal-${step.id}`,stepId:step.id,anchor:`proposal-${step.id}`,stepAnchor:anchorFor(step),number:index+1,title:`Proposal ${index+1}`,text:step.proposal??text(step.blocks?.find(block=>block.type==='paragraph')?.runs)??''}))}
function deriveContent(document){return {steps:deriveSteps(document?.steps),proposals:document?.settings?.showProposals===false?[]:deriveProposals(document?.steps)}}

const clone=value=>structuredClone(value);
const newId=(prefix,steps)=>{let n=1,id;do{id=`${prefix}-${n++}`}while(steps.some(step=>step.id===id));return id};
function addStep(document,step={},at=document.steps?.length??0){const next=clone(document),steps=next.steps||(next.steps=[]);const id=step.id&&!steps.some(x=>x.id===step.id)?step.id:newId('step',steps);steps.splice(Math.max(0,Math.min(at,steps.length)),0,{id,title:String(step.title??'New step'),proposal:step.proposal??null,blocks:clone(step.blocks||[])});return next}
function duplicateStep(document,id){const index=document.steps.findIndex(step=>step.id===id);if(index<0)return clone(document);const copy=clone(document.steps[index]);copy.id=newId(`${copy.id}-copy`,document.steps);copy.title=`${copy.title} (copy)`;return addStep(document,copy,index+1)}
function deleteStep(document,id){const next=clone(document);next.steps=next.steps.filter(step=>step.id!==id);return next}
function moveStep(document,id,toIndex){const next=clone(document),index=next.steps.findIndex(step=>step.id===id);if(index<0)return next;const [step]=next.steps.splice(index,1);next.steps.splice(Math.max(0,Math.min(toIndex,next.steps.length)),0,step);return next}

const children=node=>Array.from(node?.childNodes||node?.children||[]);
const tag=node=>String(node?.tagName||node?.nodeName||'').toLowerCase();
const nodeText=node=>node?.nodeType===3||tag(node)==='#text'?String(node.nodeValue??node.textContent??''):null;
function domToRuns(root){
  const runs=[];
  const visit=(node,mark=false,link=null)=>{
    const value=nodeText(node);if(value!==null){runs.push({text:value,highlight:mark,link:link?{href:link}:null});return}
    const name=tag(node);if(['script','style','iframe','object'].includes(name))return;
    const nextMark=mark||name==='mark';const href=name==='a'?safeHref(node.getAttribute?.('href')??node.href):link;
    const nodes=children(node);if(name==='br')runs.push({text:'\n',highlight:nextMark,link:href?{href}:null});else nodes.forEach(child=>visit(child,nextMark,href));
  };
  children(root).forEach(child=>visit(child));return normaliseRuns(runs);
}

const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderRuns(runs=[]){return runs.map(run=>{let value=escapeHTML(run.text);const href=safeHref(run.link?.href);if(href)value=`<a href="${escapeHTML(href)}" target="_blank" rel="noopener">${value}</a>`;return run.highlight?`<mark>${value}</mark>`:value}).join('')}
function renderTable(table){const widths=table.widths.map(width=>`<col style="width:${width}%">`).join('');const rows=table.rows.map((row,index)=>`<tr>${row.cells.map(cell=>`${index===0?'<th scope="col">':'<td>'}${renderRuns(cell.runs)}${index===0?'</th>':'</td>'}`).join('')}</tr>`).join('');const totals=table.totals?.enabled?`<tfoot><tr><th scope="row">${escapeHTML(table.totals.label)}</th>${Array.from({length:table.columnCount-1},(_,i)=>`<td${table.totals.columns.includes(i+1)?' data-total="true"':''}></td>`).join('')}</tr></tfoot>`:'';return `<table><colgroup>${widths}</colgroup><tbody>${rows}</tbody>${totals}</table>`}
function renderImage(image){if(!image.src)return '';return `<figure><img src="${escapeHTML(image.src)}" alt="${escapeHTML(image.alt)}" style="width:${image.width}%;max-height:${image.height}mm">${image.caption?`<figcaption>${escapeHTML(image.caption)}</figcaption>`:''}</figure>`}
function tocEntries(document,pageMap={}){return [...(document.sections||[]).map(group=>({anchor:anchorFor(group),label:group.title,page:pageMap[anchorFor(group)]??'—'})),...deriveSteps(document.steps).map(step=>({...step,page:pageMap[step.anchor]??'—'}))]}
function renderProposalLinks(steps){return deriveProposals(steps).map(proposal=>`<li id="${proposal.anchor}"><a href="#${proposal.stepAnchor}">${escapeHTML(proposal.title)}: ${escapeHTML(proposal.text)}</a></li>`).join('')}

const history=new History(structuredClone(seedDocument));let state=history.value,currentPage=1,timer;
const $=s=>document.querySelector(s); const textRuns=r=>r.map(x=>x.text).join('');
function hasReview(group){return group.blocks.some(b=>(b.runs||b.items?.flatMap(i=>i.runs)||[]).some(r=>r.highlight))}
function header(){const x=document.createElement('header');x.className='page-header';x.setAttribute('aria-label','UBTA Accountants report header');x.innerHTML='<span class="header-brand">UBTA</span><span class="header-details">UBTA Accountants Ltd <b aria-hidden="true">·</b> Practical tax advice</span>';return x}
function sheet(kind){const x=document.createElement('section');x.className=`sheet-source ${kind}`;x.append(header());return x}
function footer(x,n,total){const f=document.createElement('footer');f.className='page-footer';f.textContent=`Page ${n} of ${total}`;x.append(f)}
function runsHTML(runs){return runs.map(r=>{let t=escapeHTML(r.text);if(r.link)t=`<a href="${escapeHTML(r.link.href)}" target="_blank" rel="noopener">${t}</a>`;return r.highlight?`<mark>${t}</mark>`:t}).join('')}
function editable(block){const el=document.createElement('div');el.className='editable-block';el.dataset.blockId=block.id;el.dataset.type=block.type;el.dataset.level=block.level||'';el.contentEditable='true';el.lang='en-GB';el.spellcheck=true;if(block.type==='heading')el.innerHTML=runsHTML(block.runs);else if(block.type==='paragraph')el.innerHTML=runsHTML(block.runs);else if(block.type.endsWith('List')){el.classList.add('list-block');el.dataset.listType=block.type;el.innerHTML=block.items.map(i=>`<div class="list-item" data-item-id="${i.id}" data-level="${i.level}" style="list-style-type:${block.type==='numberList'?'decimal':'disc'}">${runsHTML(i.runs)}</div>`).join('')}else if(block.type==='table'){el.contentEditable='false';el.classList.add('table-block');el.innerHTML=renderTable(block)+block.widths.slice(0,-1).map((_,i)=>`<button class="column-resizer" data-resize-column="${i}" aria-label="Resize column ${i+1}"></button>`).join('')}else{el.contentEditable='false';el.classList.add('image-block');el.innerHTML=renderImage(block)+`<button class="image-resizer" aria-label="Resize image"></button>`}return el}
function cover(){const s=sheet('cover');const m=state.meta;s.insertAdjacentHTML('beforeend',`<div class="cover-kicker">${escapeHTML(m.documentType)} · ${escapeHTML(m.status)}</div><h1>${escapeHTML(m.clientName)}</h1><h2>${escapeHTML(m.projectTitle)} — ${escapeHTML(m.subtitle)}</h2><dl class="meta-grid"><dt>Document</dt><dd>${escapeHTML(m.documentType)}</dd><dt>Date</dt><dd>${escapeHTML(m.date)}</dd><dt>Version</dt><dd>${escapeHTML(m.version)}</dd><dt>Adviser</dt><dd>${escapeHTML(m.adviser)}</dd><dt>Status</dt><dd>${escapeHTML(m.status)}</dd></dl>`);return s}
function toc(pageMap={}){const s=sheet('contents');let entries=state.sections.map(g=>({g,label:g.title,cls:''})).concat(state.steps.map((g,i)=>({g,label:`Step ${i+1}. ${g.title}`,cls:'toc-step'})));s.insertAdjacentHTML('beforeend',`<h1 class="doc-title">Contents</h1><ol class="toc">${entries.map(e=>`<li class="${e.cls} ${hasReview(e.g)?'toc-review':''}"><a href="#anchor-${e.g.id}">${escapeHTML(e.label)}</a><span class="dots"></span><span class="toc-page">${pageMap[`anchor-${e.g.id}`]||'—'}</span></li>`).join('')}</ol>`);return s}
function groupSheet(g,title,kind){const s=sheet(kind);s.dataset.groupId=g.id;s.id=`anchor-${g.id}`;s.tabIndex=-1;s.insertAdjacentHTML('beforeend',kind==='step'?`<div class="step-label">${escapeHTML(title.split('.')[0])}</div><h1 class="section-title">${escapeHTML(title)}</h1>`:`<h1 class="section-title">${escapeHTML(title)}</h1>`);const body=document.createElement('div');body.className='document-body';g.blocks.forEach(b=>body.append(editable(b)));s.append(body);return s}
async function render(){const source=document.createElement('main');source.append(cover(),toc(window.__pageMap||{}));state.sections.forEach(g=>source.append(groupSheet(g,g.title,'section')));state.steps.forEach((g,i)=>source.append(groupSheet(g,`Step ${i+1}. ${g.title}`,'step')));const previewer=new Paged.Previewer();const target=$('#preview');await previewer.preview(source,[],target);const pages=[...target.children],map={};pages.forEach((p,i)=>{footer(p.querySelector('.sheet-source'),i+1,pages.length);p.dataset.pageNumber=i+1;p.querySelectorAll('[id^="anchor-"]').forEach(a=>map[a.id]=i+1)});window.__pageMap=map;target.querySelectorAll('.toc-page').forEach((n,i)=>{const keys=[...state.sections,...state.steps].map(g=>`anchor-${g.id}`);n.textContent=map[keys[i]]||'—'});bindEditing();bindResizers();$('#total').textContent=pages.length;currentPage=Math.min(currentPage,pages.length);$('#current').textContent=currentPage}
function findBlock(id){for(const group of [...state.sections,...state.steps]){const b=group.blocks.find(x=>x.id===id);if(b)return b}}
function commit(mutator){const previous=state;state=structuredClone(state);mutator();state=normaliseDocument(state);history.value=previous;history.commit(state);state=history.value;render()}
function bindEditing(){document.querySelectorAll('.editable-block').forEach(el=>{el.addEventListener('focusin',()=>window.activeBlock=el.dataset.blockId);el.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>syncBlock(el),450)});el.addEventListener('paste',e=>{e.preventDefault();const t=e.clipboardData.getData('text/plain');const sel=getSelection();if(sel.rangeCount){sel.deleteFromDocument();sel.getRangeAt(0).insertNode(document.createTextNode(t));sel.collapseToEnd()}el.dispatchEvent(new InputEvent('input'))});el.addEventListener('keydown',listKeys)});document.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();const dest=document.querySelector(a.getAttribute('href'));dest?.closest('.pagedjs_page')?.scrollIntoView({behavior:'smooth',block:'center'});dest?.focus()})}
function syncBlock(el){const id=el.dataset.blockId;commit(()=>{const b=findBlock(id);if(!b)return;if(b.type.endsWith('List'))b.items=[...el.querySelectorAll('.list-item')].map((x,i)=>({id:x.dataset.itemId||`${id}-item-${i}`,level:+x.dataset.level||1,runs:[{text:x.textContent,highlight:false,link:null}]}));else b.runs=domToRuns(el)})}
function listKeys(e){const el=e.currentTarget;if(!el.dataset.listType)return;const item=e.target.closest('.list-item');if(e.key==='Enter'){e.preventDefault();if(!item.textContent.trim()){commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items});return}const n=document.createElement('div');n.className='list-item';n.dataset.itemId=`item-${Date.now()}`;n.dataset.level=item.dataset.level;n.style.listStyleType=el.dataset.listType==='numberList'?'decimal':'disc';n.contentEditable='true';item.after(n);n.focus()}if(e.key==='Backspace'&&item&&!item.textContent&&getSelection().anchorOffset===0){e.preventDefault();commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items})}}
function selectedOffsets(el){const sel=getSelection();if(!sel.rangeCount||!el.contains(sel.anchorNode)||!el.contains(sel.focusNode))return null;const r=sel.getRangeAt(0),pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length;return[start,start+r.toString().length]}
function transformSelection(kind,value){const el=document.querySelector(`[data-block-id="${window.activeBlock}"]`),off=el&&selectedOffsets(el);if(!off||off[0]===off[1])return;commit(()=>{const b=findBlock(window.activeBlock);if(!b||!b.runs)return;const text=textRuns(b.runs),[a,z]=off;b.runs=normaliseRuns([{text:text.slice(0,a)},{text:text.slice(a,z),highlight:kind==='highlight'?!runsAt(b.runs,a).highlight:runsAt(b.runs,a).highlight,link:kind==='link'?{href:value}:kind==='unlink'?null:runsAt(b.runs,a).link},{text:text.slice(z)}])})}
function runsAt(runs,pos){let n=0;return runs.find(r=>(n+=r.text.length)>pos)||runs.at(-1)||{}}
function activeStep(){const id=window.activeBlock;return state.steps.find(step=>step.blocks.some(block=>block.id===id))||state.steps[0]}
function command(action){const id=window.activeBlock;if(action==='undo'){state=history.undo();return render()}if(action==='redo'){state=history.redo();return render()}if(action==='highlight')return transformSelection('highlight');if(action==='link'){const href=prompt('Link destination (https:, http:, mailto: or #anchor)');if(href&&safeHref(href))transformSelection('link',href);else if(href)alert('That link destination is not permitted.');return}if(action==='unlink')return transformSelection('unlink');if(action==='addStep')return commit(()=>{state=addStep(state)});if(['duplicateStep','deleteStep','moveStepUp','moveStepDown'].includes(action)){const step=activeStep();if(!step)return;return commit(()=>{const index=state.steps.findIndex(x=>x.id===step.id);state=action==='duplicateStep'?duplicateStep(state,step.id):action==='deleteStep'?deleteStep(state,step.id):moveStep(state,step.id,index+(action==='moveStepUp'?-1:1))})}if(!id)return;commit(()=>{const b=findBlock(id);if(action.startsWith('heading')){b.type='heading';b.level=+action.at(-1);b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(action==='body'){b.type='paragraph';b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(['bulletList','numberList'].includes(action)){const runs=b.runs||[{text:'List item'}];b.type=action;b.items=[{id:`${id}-item`,level:1,runs}];delete b.runs}else if(action==='indent'||action==='outdent'){if(b.items)b.items[0].level=Math.max(1,Math.min(3,b.items[0].level+(action==='indent'?1:-1)))}})}
function bindResizers(){document.querySelectorAll('.column-resizer,.image-resizer').forEach(handle=>{let startX,start;handle.onpointerdown=e=>{e.preventDefault();const block=findBlock(handle.closest('[data-block-id]').dataset.blockId);startX=e.clientX;start=structuredClone(block);history.beginGesture();handle.setPointerCapture?.(e.pointerId);handle.onpointermove=move=>{const delta=(move.clientX-startX)/5;state=structuredClone(state);const current=findBlock(block.id);if(handle.classList.contains('image-resizer'))current.width=Math.max(10,Math.min(100,start.width+delta));else{const i=+handle.dataset.resizeColumn;current.widths[i]=Math.max(8,Math.min(92,start.widths[i]+delta));current.widths[i+1]=Math.max(8,Math.min(92,start.widths[i+1]-delta))}history.updateGesture(state)};handle.onpointerup=()=>{history.endGesture(state);render()}}})}
document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>command(x.dataset.command));$('#style').onchange=e=>command(e.target.value);function go(n){const pages=[...document.querySelectorAll('.pagedjs_page')];currentPage=Math.max(1,Math.min(pages.length,n));$('#current').textContent=currentPage;pages[currentPage-1]?.scrollIntoView({behavior:'smooth',block:'center'})}$('#prev').onclick=()=>go(currentPage-1);$('#next').onclick=()=>go(currentPage+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft')go(currentPage-1);if(e.altKey&&e.key==='ArrowRight')go(currentPage+1)});render();
</script></body></html>
