<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>UBTA Steps Plan Editor</title>
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/document.css">
</head>
<body>
  <header class="toolbar" aria-label="Editing toolbar">
    <span class="brand">UBTA Steps Plan</span>
    <select id="style" aria-label="Block style">
      <option value="body">Body text</option><option value="heading1">Heading 1</option><option value="heading2">Heading 2</option><option value="heading3">Heading 3</option><option value="heading4">Heading 4</option>
    </select>
    <button data-command="highlight" title="Yellow highlight">Highlight</button>
    <button data-command="link">Link</button><button data-command="unlink">Remove link</button>
    <button data-command="bulletList">Bullets</button><button data-command="numberList">Numbers</button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <button data-command="addStep">Add step</button><button data-command="moveStepUp" title="Move active step earlier">Step ↑</button><button data-command="moveStepDown" title="Move active step later">Step ↓</button><button data-command="deleteStep" class="danger">Delete step</button>
    <button data-command="addImage">Add image</button><input id="image-upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    <button data-command="undo">Undo</button><button data-command="redo">Redo</button>
    <span class="spacer"></span>
    <nav class="nav" aria-label="Page navigation"><button id="prev" aria-label="Previous page">‹</button><span>Page <b id="current">1</b> of <b id="total">—</b></span><button id="next" aria-label="Next page">›</button></nav>
  </header>
  <div class="canvas"><div id="preview" class="pagedjs_pages" aria-live="polite"></div></div>
  <script src="./vendor/paged.js"></script><script type="module" src="./main.js"></script>
</body>
</html>
