const SCHEMA_VERSION = 2;
const IMAGE_MIME_TYPES = Object.freeze(['image/png', 'image/jpeg', 'image/gif', 'image/webp']);

const safeHref = href => {
  if (typeof href !== 'string') return null;
  return /^(https?:\/\/|mailto:|#[A-Za-z][\w:.-]*)/i.test(href) ? href : null;
};

const safeImageSource = source => {
  if (typeof source !== 'string') return null;
  const match = /^data:(image\/[a-z0-9.+-]+);base64,([a-z0-9+/]+={0,2})$/i.exec(source);
  if (!match || !IMAGE_MIME_TYPES.includes(match[1].toLowerCase())) return null;
  return source;
};

const newId = prefix => `${prefix}-${globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2)}`;
const validId = value => typeof value === 'string' && /^[A-Za-z][\w-]*$/.test(value);
const makeId = (value, prefix = 'id', used) => {
  let result = validId(value) ? value : newId(prefix);
  if (used) {
    while (used.has(result)) result = newId(prefix);
    used.add(result);
  }
  return result;
};

const bounded = (value, minimum, maximum, fallback) => {
  const number = Number(value);
  return Number.isFinite(number) ? Math.min(maximum, Math.max(minimum, number)) : fallback;
};

function normaliseRuns(runs) {
  return (Array.isArray(runs) ? runs : [])
    .map(run => ({
      text: text(run?.text),
      highlight: run?.highlight === true,
      link: safeHref(run?.link?.href) ? {href: safeHref(run.link.href)} : null,
    }))
    .filter(run => run.text)
    .reduce((result, run) => {
      const previous = result.at(-1);
      if (previous && previous.highlight === run.highlight && previous.link?.href === run.link?.href) previous.text += run.text;
      else result.push(run);
      return result;
    }, []);
}

const normaliseWidths = columns => {
  if (!columns.length) return [];
  const widths = columns.map(column => bounded(column?.width, 1, 100, 100 / columns.length));
  const sum = widths.reduce((total, width) => total + width, 0);
  const normalised = widths.map(width => Number((width * 100 / sum).toFixed(6)));
  normalised[normalised.length - 1] = Number((100 - normalised.slice(0, -1).reduce((total, width) => total + width, 0)).toFixed(6));
  return normalised;
};

const normaliseRow = (row, used) => ({
  id: makeId(row?.id, 'row', used),
  cells: (Array.isArray(row?.cells) ? row.cells : []).map(cell => ({
    id: makeId(cell?.id, 'cell', used),
    runs: normaliseRuns(cell?.runs),
  })),
});

function normaliseBlock(block, usedIds = new Set()) {
  const allowed = ['heading', 'paragraph', 'bulletList', 'numberList', 'table', 'image'];
  const type = allowed.includes(block?.type) ? block.type : 'paragraph';
  const out = {id: makeId(block?.id, type === 'image' ? 'image' : 'block', usedIds), type};

  if (type === 'heading') {
    out.level = bounded(block.level, 1, 4, 1);
    out.runs = normaliseRuns(block.runs);
  } else if (type === 'paragraph') {
    out.runs = normaliseRuns(block.runs);
  } else if (type === 'bulletList' || type === 'numberList') {
    out.items = (Array.isArray(block.items) ? block.items : []).map(item => ({
      id: makeId(item?.id, 'item'),
      level: bounded(item?.level, 1, 3, 1),
      runs: normaliseRuns(item?.runs),
    }));
  } else if (type === 'table') {
    const sourceColumns = Array.isArray(block.columns) ? block.columns : [];
    const widths = normaliseWidths(sourceColumns);
    out.columns = sourceColumns.map((column, index) => ({
      id: makeId(column?.id, 'column'),
      width: widths[index],
      alignment: ['left', 'centre', 'right'].includes(column?.alignment) ? column.alignment : 'left',
    }));
    out.headerRows = (Array.isArray(block.headerRows) ? block.headerRows : []).map(row => normaliseRow(row, usedIds));
    out.rows = (Array.isArray(block.rows) ? block.rows : []).map(row => normaliseRow(row, usedIds));
    out.footerRows = (Array.isArray(block.footerRows) ? block.footerRows : []).map(row => normaliseRow(row, usedIds));
    const columnIds = new Set(out.columns.map(column => column.id));
    out.totals = {
      enabled: block?.totals?.enabled === true,
      label: text(block?.totals?.label),
      columns: [...new Set(Array.isArray(block?.totals?.columns) ? block.totals.columns.filter(columnId => columnIds.has(columnId)) : [])],
    };
  } else {
    const source = safeImageSource(block.source);
    const sourceMime = source?.slice(5, source.indexOf(';')).toLowerCase() || null;
    const mimeType = IMAGE_MIME_TYPES.includes(String(block.mimeType).toLowerCase()) ? String(block.mimeType).toLowerCase() : sourceMime;
    out.source = source && mimeType === sourceMime ? source : null;
    out.mimeType = out.source ? mimeType : null;
    out.intrinsicWidth = bounded(block.intrinsicWidth, 1, 100000, 1);
    out.intrinsicHeight = bounded(block.intrinsicHeight, 1, 100000, 1);
    out.renderedWidth = bounded(block.renderedWidth, 1, 100, 100);
    out.alignment = ['left', 'centre', 'right'].includes(block.alignment) ? block.alignment : 'centre';
    out.altText = text(block.altText);
    out.captionRuns = normaliseRuns(block.captionRuns);
  }
  return out;
}

function migrateDocument(document) {
  const input = document && typeof document === 'object' ? structuredClone(document) : {};
  const version = input.schemaVersion ?? 1;
  if (version !== 1 && version !== SCHEMA_VERSION) throw Error('Unsupported schema version');
  if (version === 1) {
    input.steps = (Array.isArray(input.steps) ? input.steps : []).map(step => ({
      ...step,
      summary: step.summary ?? '',
      proposal: step.proposal ?? null,
    }));
    input.derivedContent = input.derivedContent ?? {transactionProposals: {automatic: true, sectionId: null}};
    input.schemaVersion = SCHEMA_VERSION;
  }
  return input;
}

function normaliseDocument(document) {
  const input = migrateDocument(document);
  const usedIds = new Set();
  const meta = {};
  for (const key of ['clientName', 'projectTitle', 'documentType', 'date', 'version', 'subtitle', 'adviser', 'status']) meta[key] = text(input.meta?.[key]);
  const sections = (Array.isArray(input.sections) ? input.sections : []).map(section => ({
    id: makeId(section?.id, 'section', usedIds),
    title: text(section?.title),
    blocks: (Array.isArray(section?.blocks) ? section.blocks : []).map(block => normaliseBlock(block, usedIds)),
  }));
  const steps = (Array.isArray(input.steps) ? input.steps : []).map(step => ({
    id: makeId(step?.id, 'step', usedIds),
    title: text(step?.title),
    summary: text(step?.summary),
    proposal: step?.proposal == null ? null : text(step.proposal),
    blocks: (Array.isArray(step?.blocks) ? step.blocks : []).map(block => normaliseBlock(block, usedIds)),
  }));
  const sectionIds = new Set(sections.map(section => section.id));
  const configuredSection = input.derivedContent?.transactionProposals?.sectionId;
  return {
    schemaVersion: SCHEMA_VERSION,
    meta,
    derivedContent: {
      transactionProposals: {
        automatic: input.derivedContent?.transactionProposals?.automatic !== false,
        sectionId: sectionIds.has(configuredSection) ? configuredSection : null,
      },
    },
    sections,
    steps,
  };
}

function validateDocument(document) {
  return normaliseDocument(document);
}

function bindEditing(){document.querySelectorAll('.editable-block').forEach(el=>{el.addEventListener('focusin',()=>window.activeBlock=el.dataset.blockId);el.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>syncBlock(el),450)});el.addEventListener('paste',e=>{e.preventDefault();const t=e.clipboardData.getData('text/plain');const sel=getSelection();if(sel.rangeCount){sel.deleteFromDocument();sel.getRangeAt(0).insertNode(document.createTextNode(t));sel.collapseToEnd()}el.dispatchEvent(new InputEvent('input'))});el.addEventListener('keydown',listKeys)});document.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();const dest=document.querySelector(a.getAttribute('href'));dest?.closest('.pagedjs_page')?.scrollIntoView({behavior:'smooth',block:'center'});dest?.focus()})}
function syncBlock(el){const id=el.dataset.blockId;commit(()=>{const b=findBlock(id);if(!b)return;if(b.type.endsWith('List'))b.items=[...el.querySelectorAll('.list-item')].map((x,i)=>({id:x.dataset.itemId||`${id}-item-${i}`,level:+x.dataset.level||1,runs:[{text:x.textContent,highlight:false,link:null}]}));else b.runs=[{text:el.textContent,highlight:false,link:null}]})}
function listKeys(e){const el=e.currentTarget;if(!el.dataset.listType)return;const item=e.target.closest('.list-item');if(e.key==='Enter'){e.preventDefault();if(!item.textContent.trim()){commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items});return}const n=document.createElement('div');n.className='list-item';n.dataset.itemId=`item-${Date.now()}`;n.dataset.level=item.dataset.level;n.style.listStyleType=el.dataset.listType==='numberList'?'decimal':'disc';n.contentEditable='true';item.after(n);n.focus()}if(e.key==='Backspace'&&item&&!item.textContent&&getSelection().anchorOffset===0){e.preventDefault();commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items})}}
function selectedOffsets(el){const sel=getSelection();if(!sel.rangeCount||!el.contains(sel.anchorNode)||!el.contains(sel.focusNode))return null;const r=sel.getRangeAt(0),pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length;return[start,start+r.toString().length]}
function transformSelection(kind,value){const el=document.querySelector(`[data-block-id="${window.activeBlock}"]`),off=el&&selectedOffsets(el);if(!off||off[0]===off[1])return;commit(()=>{const b=findBlock(window.activeBlock);if(!b||!b.runs)return;const text=textRuns(b.runs),[a,z]=off;b.runs=normaliseRuns([{text:text.slice(0,a)},{text:text.slice(a,z),highlight:kind==='highlight'?!runsAt(b.runs,a).highlight:runsAt(b.runs,a).highlight,link:kind==='link'?{href:value}:kind==='unlink'?null:runsAt(b.runs,a).link},{text:text.slice(z)}])})}
function runsAt(runs,pos){let n=0;return runs.find(r=>(n+=r.text.length)>pos)||runs.at(-1)||{}}
function command(action){const id=window.activeBlock;if(action==='undo'){state=history.undo();return render()}if(action==='redo'){state=history.redo();return render()}if(action==='highlight')return transformSelection('highlight');if(action==='link'){const href=prompt('Link destination (https:, http:, mailto: or #anchor)');if(href&&safeHref(href))transformSelection('link',href);else if(href)alert('That link destination is not permitted.');return}if(action==='unlink')return transformSelection('unlink');if(!id)return;commit(()=>{const b=findBlock(id);if(action.startsWith('heading')){b.type='heading';b.level=+action.at(-1);b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(action==='body'){b.type='paragraph';b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(['bulletList','numberList'].includes(action)){const runs=b.runs||[{text:'List item'}];b.type=action;b.items=[{id:`${id}-item`,level:1,runs}];delete b.runs}else if(action==='indent'||action==='outdent'){if(b.items)b.items[0].level=Math.max(1,Math.min(3,b.items[0].level+(action==='indent'?1:-1)))}})}
document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>command(x.dataset.command));$('#style').onchange=e=>command(e.target.value);function go(n){const pages=[...document.querySelectorAll('.pagedjs_page')];currentPage=Math.max(1,Math.min(pages.length,n));$('#current').textContent=currentPage;pages[currentPage-1]?.scrollIntoView({behavior:'smooth',block:'center'})}$('#prev').onclick=()=>go(currentPage-1);$('#next').onclick=()=>go(currentPage+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft')go(currentPage-1);if(e.altKey&&e.key==='ArrowRight')go(currentPage+1)});render();
</script></body></html>
