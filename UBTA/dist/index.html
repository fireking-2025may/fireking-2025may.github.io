const SCHEMA_VERSION=1;
const safeHref=h=>{if(typeof h!=='string')return null;return /^(https?:\/\/|mailto:|#[A-Za-z][\w:.-]*)/i.test(h)?h:null};

function normaliseRuns(runs){return (Array.isArray(runs)?runs:[]).map(r=>({text:String(r?.text??''),highlight:r?.highlight===true,link:safeHref(r?.link?.href)?{href:safeHref(r.link.href)}:null})).filter(r=>r.text).reduce((a,r)=>{const x=a.at(-1);if(x&&x.highlight===r.highlight&&x.link?.href===r.link?.href)x.text+=r.text;else a.push(r);return a},[])}
function normaliseBlock(b){const type=['heading','paragraph','bulletList','numberList'].includes(b?.type)?b.type:'paragraph';const out={id:id(b?.id,'block'),type};if(type==='heading'){out.level=Math.min(4,Math.max(1,Number(b.level)||1));out.runs=normaliseRuns(b.runs)}else if(type==='paragraph')out.runs=normaliseRuns(b.runs);else out.items=(Array.isArray(b.items)?b.items:[]).map(i=>({id:id(i?.id,'item'),level:Math.min(3,Math.max(1,Number(i?.level)||1)),runs:normaliseRuns(i?.runs)}));return out}
function normaliseDocument(d){const meta={};for(const k of ['clientName','projectTitle','documentType','date','version','subtitle','adviser','status'])meta[k]=String(d?.meta?.[k]??'');const groups=k=>(Array.isArray(d?.[k])?d[k]:[]).map(x=>{const group={id:id(x?.id,k.slice(0,-1)),title:String(x?.title??''),blocks:(Array.isArray(x?.blocks)?x.blocks:[]).map(normaliseBlock)};if(k==='steps'){group.summary=String(x?.summary??'');group.proposal=typeof x?.proposal==='string'&&x.proposal.trim()?x.proposal:null}return group});return{schemaVersion:SCHEMA_VERSION,meta,sections:groups('sections'),steps:groups('steps')}}
function validateDocument(d){const n=normaliseDocument(d);if(d?.schemaVersion!==SCHEMA_VERSION)throw Error('Unsupported schema version');return n}
const seedDocument=normaliseDocument({schemaVersion:1,meta:{clientName:'Example Client Ltd',projectTitle:'Corporate Restructure',documentType:'Steps Plan',subtitle:'Detailed Steps Plan',date:'25 July 2026',version:'v1',adviser:'UBTA Accountants Ltd',status:'Draft'},sections:[{id:'scope',title:'Scope of works',blocks:[{id:'scope-h',type:'heading',level:2,runs:[{text:'Purpose and scope'}]},{id:'scope-p1',type:'paragraph',runs:[{text:'This plan outlines the principal implementation steps for a proposed corporate restructure.'}]},{id:'scope-p2',type:'paragraph',runs:[{text:'Figures and legal mechanics marked for review require completion before finalisation.',highlight:true}]},{id:'scope-list',type:'bulletList',items:[{id:'si1',level:1,runs:[{text:'Confirm commercial objectives'}]},{id:'si2',level:2,runs:[{text:'Review supporting records'}]},{id:'si3',level:1,runs:[{text:'Consult the ',link:null},{text:'HMRC guidance',link:{href:'https://www.gov.uk/government/organisations/hm-revenue-customs'}}]}]}]}],steps:[{id:'share-restructure',title:'Implement the corporate share restructure',blocks:[{id:'step-h',type:'heading',level:2,runs:[{text:'Implementation'}]},{id:'step-p1',type:'paragraph',runs:[{text:'The directors will approve the proposed corporate restructure and authorise the required documentation.'}]},{id:'step-p2',type:'paragraph',runs:[{text:'Professional advisers should confirm the sequence immediately before implementation.'}]},{id:'step-list',type:'numberList',items:[{id:'st1',level:1,runs:[{text:'Prepare board minutes and resolutions.'}]},{id:'st2',level:2,runs:[{text:'Check company records and statutory filings.'}]},{id:'st3',level:1,runs:[{text:'Complete and retain the signed documents.'}]}]}]}]});

class History{constructor(value){this.past=[];this.future=[];this.value=value}commit(value){this.past.push(structuredClone(this.value));this.value=value;this.future=[]}undo(){if(!this.past.length)return this.value;this.future.push(structuredClone(this.value));return this.value=this.past.pop()}redo(){if(!this.future.length)return this.value;this.past.push(structuredClone(this.value));return this.value=this.future.pop()}}

function blockText(block) {
  const runs = block.runs || block.items?.flatMap(item => item.runs) || [];
  return runs.map(run => run.text).join(' ').replace(/\s+/g, ' ').trim();
}

function isInReview(step) {
  return step.blocks.some(block =>
    (block.runs || block.items?.flatMap(item => item.runs) || []).some(run => run.highlight)
  );
}

function generatedProposal(title, summary) {
  const subject = title.trim() || 'Complete the proposed transaction step';
  const detail = summary.trim();
  return detail ? `Proposal: ${subject} — ${detail}` : `Proposal: ${subject}.`;
}

/** Return render-only step content without mutating or committing the document. */
function deriveStepDescriptors(document) {
  return document.steps.map((step, index) => {
    const stepNumber = index + 1;
    const summary = step.summary || step.blocks.map(blockText).find(Boolean) || '';
    const generatedText = generatedProposal(step.title, summary);
    const overridden = Boolean(step.proposal?.trim());
    return {
      stepNumber, id: step.id,
      displayTitle: `Step ${stepNumber}. ${step.title}`,
      anchor: `anchor-${step.id}`,
      proposalAnchor: `anchor-proposal-${step.id}`,
      proposalText: overridden ? step.proposal : generatedText,
      generatedText,
      proposalSource: overridden ? 'override' : 'generated',
      reviewState: isInReview(step) ? 'review' : 'clear',
      tocLabel: `Step ${stepNumber}. ${step.title}`
    };
  });
}

const history=new History(structuredClone(seedDocument));let state=history.value,currentPage=1,timer;
const $=s=>document.querySelector(s); const textRuns=r=>r.map(x=>x.text).join('');
function hasReview(group){return group.blocks.some(b=>(b.runs||b.items?.flatMap(i=>i.runs)||[]).some(r=>r.highlight))}
function header(){const x=document.createElement('header');x.className='page-header';x.setAttribute('aria-label','UBTA Accountants report header');x.innerHTML='<span class="header-brand">UBTA</span><span class="header-details">UBTA Accountants Ltd <b aria-hidden="true">·</b> Practical tax advice</span>';return x}
function sheet(kind){const x=document.createElement('section');x.className=`sheet-source ${kind}`;x.append(header());return x}
function footer(x,n,total){const f=document.createElement('footer');f.className='page-footer';f.textContent=`Page ${n} of ${total}`;x.append(f)}
function runsHTML(runs){return runs.map(r=>{let t=escapeHTML(r.text);if(r.link)t=`<a href="${escapeHTML(r.link.href)}" target="_blank" rel="noopener">${t}</a>`;return r.highlight?`<mark>${t}</mark>`:t}).join('')}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function editable(block){const el=document.createElement('div');el.className='editable-block';el.dataset.blockId=block.id;el.dataset.type=block.type;el.dataset.level=block.level||'';el.contentEditable='true';el.lang='en-GB';el.spellcheck=true;if(block.type==='heading')el.innerHTML=runsHTML(block.runs);else if(block.type==='paragraph')el.innerHTML=runsHTML(block.runs);else{el.classList.add('list-block');el.dataset.listType=block.type;el.innerHTML=block.items.map(i=>`<div class="list-item" data-item-id="${i.id}" data-level="${i.level}" style="list-style-type:${block.type==='numberList'?'decimal':'disc'}">${runsHTML(i.runs)}</div>`).join('')}return el}
function cover(){const s=sheet('cover');const m=state.meta;s.insertAdjacentHTML('beforeend',`<div class="cover-kicker">${escapeHTML(m.documentType)} · ${escapeHTML(m.status)}</div><h1>${escapeHTML(m.clientName)}</h1><h2>${escapeHTML(m.projectTitle)} — ${escapeHTML(m.subtitle)}</h2><dl class="meta-grid"><dt>Document</dt><dd>${escapeHTML(m.documentType)}</dd><dt>Date</dt><dd>${escapeHTML(m.date)}</dd><dt>Version</dt><dd>${escapeHTML(m.version)}</dd><dt>Adviser</dt><dd>${escapeHTML(m.adviser)}</dd><dt>Status</dt><dd>${escapeHTML(m.status)}</dd></dl>`);return s}
function toc(descriptors,pageMap={}){const s=sheet('contents');const entries=state.sections.map(g=>({anchor:`anchor-${g.id}`,label:g.title,cls:'',review:hasReview(g)})).concat(descriptors.map(d=>({anchor:d.anchor,label:d.tocLabel,cls:'toc-step',review:d.reviewState==='review'})),[{anchor:'anchor-transaction-proposals',label:'Transaction Proposals',cls:'toc-generated',review:descriptors.some(d=>d.reviewState==='review')}]);s.insertAdjacentHTML('beforeend',`<h1 class="doc-title">Contents</h1><ol class="toc">${entries.map(e=>`<li class="${e.cls} ${e.review?'toc-review':''}"><a href="#${e.anchor}">${escapeHTML(e.label)}</a><span class="dots"></span><span class="toc-page" data-page-anchor="${e.anchor}">${pageMap[e.anchor]||'—'}</span></li>`).join('')}</ol>`);return s}
function groupSheet(g,title,kind){const s=sheet(kind);s.id=`anchor-${g.id}`;s.tabIndex=-1;s.insertAdjacentHTML('beforeend',kind==='step'?`<div class="step-label">${escapeHTML(title.split('.')[0])}</div><h1 class="section-title">${escapeHTML(title)}</h1>`:`<h1 class="section-title">${escapeHTML(title)}</h1>`);const body=document.createElement('div');body.className='document-body';g.blocks.forEach(b=>body.append(editable(b)));s.append(body);return s}
function proposalsSheet(descriptors){const s=sheet('proposals');s.id='anchor-transaction-proposals';s.tabIndex=-1;s.insertAdjacentHTML('beforeend','<h1 class="section-title">Transaction Proposals</h1>');const body=document.createElement('div');body.className='document-body proposal-list';descriptors.forEach(d=>{const article=document.createElement('article');article.id=d.proposalAnchor;article.className=`proposal-entry ${d.reviewState==='review'?'proposal-review':''}`;article.innerHTML=`<h2><a href="#${d.anchor}">${escapeHTML(d.displayTitle)}</a></h2><div class="proposal-status">${d.proposalSource==='override'?'Explicit override':'Generated from step'}</div><p>${escapeHTML(d.proposalText)}</p>${d.proposalSource==='override'?`<button type="button" class="reset-proposal" data-step-id="${escapeHTML(d.id)}">Reset to generated proposal</button>`:''}`;body.append(article)});s.append(body);return s}
async function render(){const descriptors=deriveStepDescriptors(state);const source=document.createElement('main');source.append(cover(),toc(descriptors,window.__pageMap||{}));state.sections.forEach(g=>source.append(groupSheet(g,g.title,'section')));descriptors.forEach(d=>source.append(groupSheet(state.steps.find(g=>g.id===d.id),d.displayTitle,'step')));source.append(proposalsSheet(descriptors));const previewer=new Paged.Previewer();const target=$('#preview');await previewer.preview(source,[],target);const pages=[...target.children],map={};pages.forEach((p,i)=>{footer(p.querySelector('.sheet-source'),i+1,pages.length);p.dataset.pageNumber=i+1;p.querySelectorAll('[id^="anchor-"]').forEach(a=>map[a.id]=i+1)});window.__pageMap=map;target.querySelectorAll('.toc-page').forEach(n=>{n.textContent=map[n.dataset.pageAnchor]||'—'});bindEditing();$('#total').textContent=pages.length;currentPage=Math.min(currentPage,pages.length);$('#current').textContent=currentPage}
function findBlock(id){for(const group of [...state.sections,...state.steps]){const b=group.blocks.find(x=>x.id===id);if(b)return b}}
function commit(mutator){const previous=state;state=structuredClone(state);mutator();state=normaliseDocument(state);history.value=previous;history.commit(state);state=history.value;render()}
function bindEditing(){document.querySelectorAll('.editable-block').forEach(el=>{el.addEventListener('focusin',()=>window.activeBlock=el.dataset.blockId);el.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>syncBlock(el),450)});el.addEventListener('paste',e=>{e.preventDefault();const t=e.clipboardData.getData('text/plain');const sel=getSelection();if(sel.rangeCount){sel.deleteFromDocument();sel.getRangeAt(0).insertNode(document.createTextNode(t));sel.collapseToEnd()}el.dispatchEvent(new InputEvent('input'))});el.addEventListener('keydown',listKeys)});document.querySelectorAll('.toc a,.proposal-entry h2 a').forEach(a=>a.onclick=e=>{e.preventDefault();const dest=document.querySelector(a.getAttribute('href'));dest?.closest('.pagedjs_page')?.scrollIntoView({behavior:'smooth',block:'center'});dest?.focus()});document.querySelectorAll('.reset-proposal').forEach(button=>button.onclick=()=>commit(()=>{const step=state.steps.find(item=>item.id===button.dataset.stepId);if(step)step.proposal=null}))}
function syncBlock(el){const id=el.dataset.blockId;commit(()=>{const b=findBlock(id);if(!b)return;if(b.type.endsWith('List'))b.items=[...el.querySelectorAll('.list-item')].map((x,i)=>({id:x.dataset.itemId||`${id}-item-${i}`,level:+x.dataset.level||1,runs:[{text:x.textContent,highlight:false,link:null}]}));else b.runs=[{text:el.textContent,highlight:false,link:null}]})}
function listKeys(e){const el=e.currentTarget;if(!el.dataset.listType)return;const item=e.target.closest('.list-item');if(e.key==='Enter'){e.preventDefault();if(!item.textContent.trim()){commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items});return}const n=document.createElement('div');n.className='list-item';n.dataset.itemId=`item-${Date.now()}`;n.dataset.level=item.dataset.level;n.style.listStyleType=el.dataset.listType==='numberList'?'decimal':'disc';n.contentEditable='true';item.after(n);n.focus()}if(e.key==='Backspace'&&item&&!item.textContent&&getSelection().anchorOffset===0){e.preventDefault();commit(()=>{const b=findBlock(el.dataset.blockId);b.type='paragraph';b.runs=[{text:'',highlight:false,link:null}];delete b.items})}}
function selectedOffsets(el){const sel=getSelection();if(!sel.rangeCount||!el.contains(sel.anchorNode)||!el.contains(sel.focusNode))return null;const r=sel.getRangeAt(0),pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length;return[start,start+r.toString().length]}
function transformSelection(kind,value){const el=document.querySelector(`[data-block-id="${window.activeBlock}"]`),off=el&&selectedOffsets(el);if(!off||off[0]===off[1])return;commit(()=>{const b=findBlock(window.activeBlock);if(!b||!b.runs)return;const text=textRuns(b.runs),[a,z]=off;b.runs=normaliseRuns([{text:text.slice(0,a)},{text:text.slice(a,z),highlight:kind==='highlight'?!runsAt(b.runs,a).highlight:runsAt(b.runs,a).highlight,link:kind==='link'?{href:value}:kind==='unlink'?null:runsAt(b.runs,a).link},{text:text.slice(z)}])})}
function runsAt(runs,pos){let n=0;return runs.find(r=>(n+=r.text.length)>pos)||runs.at(-1)||{}}
function command(action){const id=window.activeBlock;if(action==='undo'){state=history.undo();return render()}if(action==='redo'){state=history.redo();return render()}if(action==='highlight')return transformSelection('highlight');if(action==='link'){const href=prompt('Link destination (https:, http:, mailto: or #anchor)');if(href&&safeHref(href))transformSelection('link',href);else if(href)alert('That link destination is not permitted.');return}if(action==='unlink')return transformSelection('unlink');if(!id)return;commit(()=>{const b=findBlock(id);if(action.startsWith('heading')){b.type='heading';b.level=+action.at(-1);b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(action==='body'){b.type='paragraph';b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(['bulletList','numberList'].includes(action)){const runs=b.runs||[{text:'List item'}];b.type=action;b.items=[{id:`${id}-item`,level:1,runs}];delete b.runs}else if(action==='indent'||action==='outdent'){if(b.items)b.items[0].level=Math.max(1,Math.min(3,b.items[0].level+(action==='indent'?1:-1)))}})}
document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>command(x.dataset.command));$('#style').onchange=e=>command(e.target.value);function go(n){const pages=[...document.querySelectorAll('.pagedjs_page')];currentPage=Math.max(1,Math.min(pages.length,n));$('#current').textContent=currentPage;pages[currentPage-1]?.scrollIntoView({behavior:'smooth',block:'center'})}$('#prev').onclick=()=>go(currentPage-1);$('#next').onclick=()=>go(currentPage+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft')go(currentPage-1);if(e.altKey&&e.key==='ArrowRight')go(currentPage+1)});render();
