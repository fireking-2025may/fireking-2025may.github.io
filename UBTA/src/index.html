<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>UBTA Steps Plan Editor</title><link rel="stylesheet" href="./styles/app.css"><link rel="stylesheet" href="./styles/document.css"></head><body><header class="toolbar" aria-label="Editing toolbar"><span class="brand">UBTA Steps Plan</span><select id="style" aria-label="Block style"><option value="body">Body text</option><option value="heading1">Heading 1</option><option value="heading2">Heading 2</option><option value="heading3">Heading 3</option><option value="heading4">Heading 4</option></select><button data-command="highlight" title="Yellow highlight">Highlight</button><button data-command="link">Link</button><button data-command="unlink">Remove link</button><button data-command="bulletList">Bullets</button><button data-command="numberList">Numbers</button><button data-command="indent">Increase level</button><button data-command="outdent">Decrease level</button><button data-command="undo">Undo</button><button data-command="redo">Redo</button><div id="table-controls" class="table-controls" aria-label="Selected table controls" hidden><button data-table-command="add-row">Add row</button><button data-table-command="delete-row">Delete row</button><button data-table-command="add-column">Add column</button><button data-table-command="delete-column">Delete column</button><button data-table-command="header">Header row</button><label>Total <select id="table-total" aria-label="Column to total"><option value="">None</option></select></label><label>Decimals <input id="total-precision" type="number" min="0" max="12" value="2" aria-label="Total decimal places"></label><button data-table-command="remove" class="danger">Remove table</button></div><span class="spacer"></span><nav class="nav" aria-label="Page navigation"><button id="prev" aria-label="Previous page">‹</button><span>Page <b id="current">1</b> of <b id="total">—</b></span><button id="next" aria-label="Next page">›</button></nav></header><div class="canvas"><div id="preview" class="pagedjs_pages" aria-live="polite"></div></div><script src="./vendor/paged.js"></script><script type="module" src="./main.js"></script></body></html>
