const SCHEMA_VERSION=1;

class History{constructor(value){this.past=[];this.future=[];this.value=value}commit(value){this.past.push(structuredClone(this.value));this.value=value;this.future=[]}undo(){if(!this.past.length)return this.value;this.future.push(structuredClone(this.value));return this.value=this.past.pop()}redo(){if(!this.future.length)return this.value;this.past.push(structuredClone(this.value));return this.value=this.future.pop()}}

const $=s=>document.querySelector(s); const textRuns=r=>r.map(x=>x.text).join('');

function groupSheet(g,title,kind){const s=sheet(kind);s.id=`anchor-${g.id}`;s.dataset.groupId=g.id;s.dataset.groupKind=kind;s.tabIndex=-1;if(kind==='step'){const position=state.steps.findIndex(step=>step.id===g.id)+1;s.insertAdjacentHTML('beforeend',`<div class="step-label">Step ${position}</div><h1 class="section-title step-title-edit" contenteditable="true" spellcheck="true" data-step-id="${escapeHTML(g.id)}" aria-label="Title for Step ${position}">${escapeHTML(g.title)}</h1>`)}else s.insertAdjacentHTML('beforeend',`<h1 class="section-title">${escapeHTML(title)}</h1>`);const body=document.createElement('div');body.className='document-body';g.blocks.forEach(b=>body.append(editable(b)));s.append(body);return s}
async function render(){const selectedId=pendingFocusStepId||activeStepId;const oldAnchor=selectedId&&document.querySelector(`#anchor-${CSS.escape(selectedId)}`);const oldTop=oldAnchor?.getBoundingClientRect().top;const oldScroll=window.scrollY;const source=document.createElement('main');source.append(cover(),toc(window.__pageMap||{}));state.sections.forEach(g=>source.append(groupSheet(g,g.title,'section')));state.steps.forEach((g,i)=>source.append(groupSheet(g,`Step ${i+1}. ${g.title}`,'step')));const previewer=new Paged.Previewer();const target=$('#preview');await previewer.preview(source,[],target);const pages=[...target.children],map={};pages.forEach((p,i)=>{footer(p.querySelector('.sheet-source'),i+1,pages.length);p.dataset.pageNumber=i+1;p.querySelectorAll('[id^="anchor-"]').forEach(a=>map[a.id]=i+1)});window.__pageMap=map;target.querySelectorAll('.toc-page').forEach((n,i)=>{const keys=[...state.sections,...state.steps].map(g=>`anchor-${g.id}`);n.textContent=map[keys[i]]||'—'});bindEditing();$('#total').textContent=pages.length;currentPage=Math.max(1,Math.min(currentPage,pages.length||1));$('#current').textContent=currentPage;updateStepToolbar();const newAnchor=selectedId&&document.querySelector(`#anchor-${CSS.escape(selectedId)}`);if(newAnchor){if(pendingFocusStepId){newAnchor.querySelector('.step-title-edit')?.focus();pendingFocusStepId=null}else if(oldTop!=null)window.scrollTo({top:oldScroll+newAnchor.getBoundingClientRect().top-oldTop})}}
function findBlock(id){for(const group of [...state.sections,...state.steps]){const b=group.blocks.find(x=>x.id===id);if(b)return b}}
function commit(mutator,focusStepId=null){const previous=state;state=structuredClone(state);mutator();state=normaliseDocument(state);history.value=previous;history.commit(state);state=history.value;if(focusStepId){activeStepId=focusStepId;pendingFocusStepId=focusStepId}return render()}

function transformSelection(kind,value){const el=document.querySelector(`[data-block-id="${window.activeBlock}"]`),off=el&&selectedOffsets(el);if(!off||off[0]===off[1])return;commit(()=>{const b=findBlock(window.activeBlock);if(!b||!b.runs)return;const text=textRuns(b.runs),[a,z]=off;b.runs=normaliseRuns([{text:text.slice(0,a)},{text:text.slice(a,z),highlight:kind==='highlight'?!runsAt(b.runs,a).highlight:runsAt(b.runs,a).highlight,link:kind==='link'?{href:value}:kind==='unlink'?null:runsAt(b.runs,a).link},{text:text.slice(z)}])})}
function runsAt(runs,pos){let n=0;return runs.find(r=>(n+=r.text.length)>pos)||runs.at(-1)||{}}
function command(action){const id=window.activeBlock;if(action==='undo'){state=history.undo();return render()}if(action==='redo'){state=history.redo();return render()}if(action==='highlight')return transformSelection('highlight');if(action==='link'){const href=prompt('Link destination (https:, http:, mailto: or #anchor)');if(href&&safeHref(href))transformSelection('link',href);else if(href)alert('That link destination is not permitted.');return}if(action==='unlink')return transformSelection('unlink');if(!id)return;commit(()=>{const b=findBlock(id);if(action.startsWith('heading')){b.type='heading';b.level=+action.at(-1);b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(action==='body'){b.type='paragraph';b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(['bulletList','numberList'].includes(action)){const runs=b.runs||[{text:'List item'}];b.type=action;b.items=[{id:`${id}-item`,level:1,runs}];delete b.runs}else if(action==='indent'||action==='outdent'){if(b.items)b.items[0].level=Math.max(1,Math.min(3,b.items[0].level+(action==='indent'?1:-1)))}})}
document.querySelectorAll('[data-step-command]').forEach(button=>button.onclick=()=>stepCommand(button.dataset.stepCommand));document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>command(x.dataset.command));$('#style').onchange=e=>command(e.target.value);function go(n){const pages=[...document.querySelectorAll('.pagedjs_page')];currentPage=Math.max(1,Math.min(pages.length,n));$('#current').textContent=currentPage;pages[currentPage-1]?.scrollIntoView({behavior:'smooth',block:'center'})}$('#prev').onclick=()=>go(currentPage-1);$('#next').onclick=()=>go(currentPage+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft')go(currentPage-1);if(e.altKey&&e.key==='ArrowRight')go(currentPage+1)});render();
</script></body></html>
