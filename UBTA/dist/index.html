function bindImage(el){const id=el.dataset.blockId;el.addEventListener('focusin',()=>{window.activeBlock=id;el.classList.add('selected')});el.addEventListener('focusout',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('selected')});el.querySelector('.image-caption').addEventListener('paste',plainPaste);el.querySelector('.image-caption').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>updateImage(id,{caption:normaliseRuns([{text:e.target.textContent}])}),450)});el.querySelector('.image-alt').addEventListener('change',e=>updateImage(id,{alt:e.target.value}));el.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>updateImage(id,{alignment:b.dataset.align}));el.querySelector('[data-remove]').onclick=()=>commit(()=>{for(const g of [...state.sections,...state.steps]){const i=g.blocks.findIndex(b=>b.id===id);if(i>=0){g.blocks.splice(i,1);break}}});el.addEventListener('keydown',e=>{if(e.target!==el)return;let change;if(e.shiftKey&&e.key==='ArrowLeft')change={alignment:'left'};else if(e.shiftKey&&e.key==='ArrowRight')change={alignment:'right'};else if(e.shiftKey&&e.key==='ArrowUp')change={alignment:'centre'};else if(e.key==='ArrowLeft'||e.key==='ArrowDown')change={widthPercent:findBlock(id).widthPercent-2};else if(e.key==='ArrowRight'||e.key==='ArrowUp')change={widthPercent:findBlock(id).widthPercent+2};if(change){e.preventDefault();updateImage(id,change)}});el.querySelectorAll('[data-resize]').forEach(handle=>{handle.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const grow=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:-1;updateImage(id,{widthPercent:findBlock(id).widthPercent+grow*(e.shiftKey?10:2)})});handle.addEventListener('pointerdown',e=>{e.preventDefault();const start=e.clientX,startWidth=el.getBoundingClientRect().width,available=el.closest('.document-body').getBoundingClientRect().width,direction=+handle.dataset.resize;handle.setPointerCapture(e.pointerId);const move=x=>{const px=startWidth+(x-start)*direction;el.style.width=`${Math.min(100,Math.max(10,px/available*100))}%`};handle.onpointermove=x=>move(x.clientX);handle.onpointerup=()=>{handle.onpointermove=null;handle.onpointerup=null;updateImage(id,{widthPercent:parseFloat(el.style.width)})}})})}
function sniffImageType(bytes){const b=new Uint8Array(bytes);if(b.length>=8&&b[0]===0x89&&b[1]===0x50&&b[2]===0x4e&&b[3]===0x47&&b[4]===0x0d&&b[5]===0x0a&&b[6]===0x1a&&b[7]===0x0a)return'image/png';if(b.length>=3&&b[0]===0xff&&b[1]===0xd8&&b[2]===0xff)return'image/jpeg';if(b.length>=6&&String.fromCharCode(...b.slice(0,6)).match(/^GIF8[79]a$/))return'image/gif';if(b.length>=12&&String.fromCharCode(...b.slice(0,4))==='RIFF'&&String.fromCharCode(...b.slice(8,12))==='WEBP')return'image/webp';return null}
async function decodeDimensions(file){if('createImageBitmap'in window){try{const bitmap=await createImageBitmap(file);const dimensions={width:bitmap.width,height:bitmap.height};bitmap.close();return dimensions}catch{ /* The Image fallback provides consistent browser coverage. */ }}const url=URL.createObjectURL(file);try{return await new Promise((resolve,reject)=>{const image=new Image;image.onload=()=>resolve({width:image.naturalWidth,height:image.naturalHeight});image.onerror=()=>reject(Error('The image content is malformed or cannot be decoded.'));image.src=url})}finally{URL.revokeObjectURL(url)}}
const fileDataURL=file=>new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('The image could not be read.'));reader.readAsDataURL(file)});
function imageError(message=''){$('#image-error').textContent=message}
async function insertImage(file){imageError();try{if(!file) return;if(!IMAGE_MIME_TYPES.includes(file.type))throw Error('Unsupported image type. Choose a PNG, JPEG, GIF or WebP file.');if(file.size>MAX_IMAGE_BYTES)throw Error(`Image is too large. The maximum file size is ${MAX_IMAGE_BYTES/1024/1024} MB.`);const bytes=await file.arrayBuffer(),decodedType=sniffImageType(bytes);if(decodedType!==file.type)throw Error('The selected file content does not match its reported image type.');const {width,height}=await decodeDimensions(file);if(!width||!height)throw Error('The image has invalid dimensions.');if(width>MAX_IMAGE_DIMENSION||height>MAX_IMAGE_DIMENSION||width*height>MAX_IMAGE_PIXELS)throw Error(`Image dimensions are too large (maximum ${MAX_IMAGE_DIMENSION} px per side and ${MAX_IMAGE_PIXELS.toLocaleString()} pixels).`);const src=await fileDataURL(file),block={id:`image-${Date.now()}`,type:'image',src,mime:file.type,intrinsicWidth:width,intrinsicHeight:height,widthPercent:60,alignment:'centre',alt:'',caption:[]};commit(()=>{let group=state.sections[0]||state.steps[0];let index=group?.blocks.length||0;for(const g of [...state.sections,...state.steps]){const i=g.blocks.findIndex(b=>b.id===window.activeBlock);if(i>=0){group=g;index=i+1;break}}if(!group)throw Error('There is no document section in which to insert the image.');group.blocks.splice(index,0,block)});window.activeBlock=block.id}catch(error){imageError(error.message)}}
function command(action){const id=window.activeBlock;if(action==='undo'){state=history.undo();return render()}if(action==='redo'){state=history.redo();return render()}if(action==='highlight')return transformSelection('highlight');if(action==='link'){const href=prompt('Link destination (https:, http:, mailto: or #anchor)');if(href&&safeHref(href))transformSelection('link',href);else if(href)alert('That link destination is not permitted.');return}if(action==='unlink')return transformSelection('unlink');if(!id)return;commit(()=>{const b=findBlock(id);if(action.startsWith('heading')){b.type='heading';b.level=+action.at(-1);b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(action==='body'){b.type='paragraph';b.runs=b.runs||b.items?.flatMap(i=>i.runs)||[]}else if(['bulletList','numberList'].includes(action)){const runs=b.runs||[{text:'List item'}];b.type=action;b.items=[{id:`${id}-item`,level:1,runs}];delete b.runs}else if(action==='indent'||action==='outdent'){if(b.items)b.items[0].level=Math.max(1,Math.min(3,b.items[0].level+(action==='indent'?1:-1)))}})}
document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>command(x.dataset.command));$('#style').onchange=e=>command(e.target.value);$('#insert-image').onclick=()=>{$('#image-file').value='';$('#image-file').click()};$('#image-file').onchange=e=>insertImage(e.target.files[0]);function go(n){const pages=[...document.querySelectorAll('.pagedjs_page')];currentPage=Math.max(1,Math.min(pages.length,n));$('#current').textContent=currentPage;pages[currentPage-1]?.scrollIntoView({behavior:'smooth',block:'center'})}$('#prev').onclick=()=>go(currentPage-1);$('#next').onclick=()=>go(currentPage+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft')go(currentPage-1);if(e.altKey&&e.key==='ArrowRight')go(currentPage+1)});render();
</script></body></html>
