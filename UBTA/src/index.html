<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>UBTA Steps Plan Editor</title>
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/document.css">
</head>
<body>
  <div class="editor-command-bars">
  <header class="toolbar" aria-label="Editing toolbar">
    <span class="brand">UBTA Steps Plan</span>
    <div class="toolbar-group" role="group" aria-label="History"><button data-command="undo">Undo</button><button data-command="redo">Redo</button><button id="document-properties" type="button">Document properties</button><button id="save-draft" type="button">Save now</button><button id="save-version" type="button">Save version</button><button id="show-versions" type="button">Versions</button><button id="share-snapshot" type="button">Copy snapshot link</button><span id="save-state" class="save-state" role="status">Saved locally</span></div>
    <div class="toolbar-group" role="group" aria-label="Text formatting"><select id="style" data-text-command aria-label="Block style"><option value="body">Body text</option><option value="heading1">Heading 1</option><option value="heading2">Heading 2</option><option value="heading3">Heading 3</option><option value="heading4">Heading 4</option></select><button data-command="highlight" data-text-command>Highlight</button><button data-command="link" data-text-command>Link</button><button data-command="unlink" data-text-command>Remove link</button></div>
    <div class="toolbar-group" role="group" aria-label="Insert content"><button data-command="addParagraph" data-requires-step>Add body text</button><button data-command="addHeading" data-requires-step>Add heading</button><button data-command="addBulletList" data-requires-step>Add bullet list</button><button data-command="addNumberList" data-requires-step>Add numbered list</button><button data-command="addTable" data-requires-step>Add table</button><button data-command="addImage" data-requires-step>Add image</button><input id="image-upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></div>
    <div class="toolbar-group" role="group" aria-label="Step management"><button data-command="addStepBefore" data-requires-step>Add step before</button><button data-command="addStepAfter" data-requires-step>Add step after</button><button data-command="moveStepUp">Step ↑</button><button data-command="moveStepDown">Step ↓</button><button data-command="deleteStep" class="danger">Delete step</button></div>
    <div class="toolbar-group" role="group" aria-label="Table tools"><button data-command="addRow" data-table-command>Add row</button><button data-command="removeRow" data-table-command>Remove row</button><button data-command="addColumn" data-table-command>Add column</button><button data-command="removeColumn" data-table-command>Remove column</button></div>
    <nav class="nav"><button id="prev">‹</button><span>Page <b id="current">1</b> of <b id="total">—</b></span><button id="next">›</button></nav>
  </header>
  </div>
  <dialog id="properties-dialog"><form id="properties-form"><h2>Document properties</h2><div class="properties-grid"><label>Client name<input name="clientName" type="text" maxlength="120" required></label><label>Project title<input name="projectTitle" type="text" maxlength="120" required></label><label>Document type<input name="documentType" type="text" maxlength="80" required></label><label>Date<input name="date" type="date" required></label><label>Version<input name="version" type="text" maxlength="30" required></label><label>Subtitle<input name="subtitle" type="text" maxlength="160"></label><label>Adviser<input name="adviser" type="text" maxlength="120" required></label><label>Status<select name="status" required><option>Draft</option><option>For review</option><option>Final</option></select></label></div><div class="dialog-actions"><button type="button" data-close-properties>Cancel</button><button type="submit">Update document</button></div></form></dialog>
  <dialog id="versions-dialog"><form method="dialog"><h2>Local saved versions</h2><p>Up to 20 named versions are kept in this browser.</p><div id="versions-list" class="versions-list"></div><div><button value="cancel">Close</button></div></form></dialog><dialog id="link-picker"><form id="link-form"><h2>Choose a link destination</h2><label>Document destination<select id="link-destination"></select></label><span>or</span><label>External URL<input id="external-link" type="url" placeholder="https://example.com"></label><div><button type="button" onclick="this.closest('dialog').close()">Cancel</button><button type="submit">Apply link</button></div></form></dialog><div id="editor-status" class="visually-hidden" aria-live="polite"></div>
  <div class="canvas"><div id="preview" class="pagedjs_pages" aria-live="polite"></div></div>
  <script src="./vendor/paged.js"></script><script type="module" src="./main.js"></script>
</body>
</html>
